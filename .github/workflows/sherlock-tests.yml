name: Sherlock Web API regression tests

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/sherlock-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sherlock and API test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Check Python syntax
        run: python -m compileall -q app.py tests
      - name: Exercise real API code with an offline Sherlock fixture
        run: python -m unittest discover -s tests -v
      - name: Verify official Sherlock CLI availability
        run: python -m sherlock_project --version
